<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hazelnut Shell (Brown) -->
  <ellipse cx="30" cy="30" rx="22" ry="24" fill="#8B4513"/>
  <ellipse cx="30" cy="30" rx="22" ry="24" fill="url(#hazelnutGradient)"/>
  
  <!-- Gradient for depth -->
  <defs>
    <linearGradient id="hazelnutGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B3410;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Texture lines on hazelnut -->
  <path d="M 15 20 Q 30 25 45 20" stroke="#6B3410" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 15 30 Q 30 35 45 30" stroke="#6B3410" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 15 40 Q 30 45 45 40" stroke="#6B3410" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Left Leaf -->
  <path d="M 12 15 Q 5 10 8 5 Q 12 8 12 15 Z" fill="url(#leafGradient)"/>
  <path d="M 8 5 Q 10 10 12 15" stroke="#16a34a" stroke-width="0.5" fill="none"/>
  
  <!-- Right Leaf -->
  <path d="M 48 15 Q 55 10 52 5 Q 48 8 48 15 Z" fill="url(#leafGradient)"/>
  <path d="M 52 5 Q 50 10 48 15" stroke="#16a34a" stroke-width="0.5" fill="none"/>
  
  <!-- AF Letters inside hazelnut -->
  <text x="30" y="37" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">AF</text>
  
  <!-- Company Name -->
  <text x="70" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a">Amcaoğlu</text>
  <text x="70" y="45" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Fındık &amp; Makineler</text>
</svg>
