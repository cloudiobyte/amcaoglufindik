<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="60" height="60" rx="12" fill="#f8fafc"/>
  
  <!-- Hazelnut Shell -->
  <ellipse cx="30" cy="30" rx="18" ry="20" fill="url(#hazelnutGrad)"/>
  
  <defs>
    <linearGradient id="hazelnutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B3410;stop-opacity:1" />
